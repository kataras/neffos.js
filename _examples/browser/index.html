<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>neffos.js browser example</title>
<!--
  Shows: the neffos.js global build (the `neffos` object a plain <script>
  tag exposes), dialing a Go server, joining a room and chatting in it.

  Run it: `cd ../server && go run .`, then open http://localhost:8080.
  The script below loads the library from /dist/ (served locally by that
  Go server) because neffos.js 0.3.0 is not published yet; once it is,
  swap the <script src="/dist/..."> line below for the commented jsdelivr
  one further down.

  Try it: open this page in two tabs, type a name and a room, and send a
  few messages. Each tab sees the other's messages and its join/leave.

  Read next: ../node/client.mjs for the same chat from a terminal, or
  ../bundler/ for a build-tool setup instead of a <script> tag.
-->
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; }
  #log { border: 1px solid #ccc; height: 240px; overflow-y: auto; padding: 0.5rem; margin-bottom: 0.5rem; }
  #log p { margin: 0.25rem 0; }
  form { display: flex; gap: 0.5rem; }
  input { flex: 1; padding: 0.4rem; }
</style>
</head>
<body>
<h1>neffos.js browser example</h1>
<p>Name: <input id="name" value="guest" size="10" /> Room: <input id="room" value="lobby" size="10" /></p>
<div id="log"></div>
<form id="chat-form">
  <input id="message" placeholder="Type a message and press enter" autocomplete="off" />
</form>

<script src="/dist/neffos.global.min.js"></script>
<!-- Once 0.3.0 is published, use the CDN build instead of the local one above:
<script src="https://cdn.jsdelivr.net/npm/neffos.js@0.3/dist/neffos.global.min.js"></script>
-->
<script>
  // Top-level await is not available in a plain <script> tag, so the setup
  // runs inside an async function instead.
  (async function main() {
    const log = document.getElementById('log');
    const print = (text) => {
      const p = document.createElement('p');
      p.textContent = text;
      log.appendChild(p);
      log.scrollTop = log.scrollHeight;
    };

    const name = document.getElementById('name').value;
    const roomName = document.getElementById('room').value;

    const conn = await neffos.dial('ws://localhost:8080/ws', {
      default: {
        _OnNamespaceConnected(ns, msg) {
          print(`connected to namespace [${msg.Namespace}]`);
        },
        _OnNamespaceDisconnect() {
          print('disconnected');
        },
        _OnRoomJoined(ns, msg) {
          print(`joined room [${msg.Room}]`);
        },
        chat(ns, msg) {
          print(msg.text());
        },
      },
    });

    const ns = await conn.connect('default');
    await ns.joinRoom(roomName);

    const form = document.getElementById('chat-form');
    const input = document.getElementById('message');
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (text === '') {
        return;
      }
      ns.room(roomName)?.emit('chat', `${name}: ${text}`);
      input.value = '';
    });
  })().catch((err) => {
    console.error(err);
    alert(`failed to connect: ${err.message}`);
  });
</script>
</body>
</html>
